{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><div class="eyebrow">Activity</div><h1>Notifications</h1></div><form method="post" action="{% url 'notifications_mark_read' %}">{% csrf_token %}<button type="submit" class="button secondary">Mark all read</button></form></div><div class="stack">{% for n in notifications %}<div class="panel notice {% if not n.is_read %}unread{% endif %}"><p>{{ n.message }}</p><small>{{ n.created_at|date:'M j, Y · H:i' }}</small>{% if n.post %}<p><a href="{% url 'post_detail' n.post.pk %}">View related post →</a></p>{% endif %}</div>{% empty %}<div class="panel">You have no notifications yet.</div>{% endfor %}</div>{% endblock %}
